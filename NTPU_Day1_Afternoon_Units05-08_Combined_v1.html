function decodeBase64(b64){const bin=atob(b64);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function send(i,action,slide){if(!ready[i]){pending[i].push({action,slide});return}frames[i].contentWindow.postMessage({scope:'ntpu-day1-afternoon-master',action,slide},'*')}
function progress(){const global=prefix[unit]+positions[unit]+1;document.getElementById('totalCount').textContent=String(global).padStart(2,'0')+' / '+TOTAL;document.getElementById('globalProgressInner').style.width=(global/TOTAL*100)+'%';select.value=String(unit);document.title='銷狼養成記｜第一天下半堂 · '+labels[unit]+' · '+global+'/'+TOTAL;try{history.replaceState(null,'','#'+global)}catch(_e){}}
function activate(next,at){if(next<0||next>=counts.length)return;frames[unit].classList.remove('active');unit=next;frames[unit].classList.add('active');select.value=String(unit);if(Number.isInteger(at)){positions[unit]=Math.max(0,Math.min(counts[unit]-1,at));send(unit,'go',positions[unit]);}send(unit,'resize');progress();}
function direction(dir){send(unit,dir>0?'next':'prev')}
window.addEventListener('message',function(e){const d=e.data;if(!d||d.scope!=='ntpu-day1-afternoon'||!Number.isInteger(d.unit)||d.unit<0||d.unit>=counts.length||e.source!==frames[d.unit].contentWindow)return;
 const i=d.unit;
 if(d.kind==='ready'){ready[i]=true;positions[i]=d.slide||0;if(pending[i].length){for(const p of pending[i])send(i,p.action,p.slide);pending[i]=[]}if(i===unit)progress()}
 else if(d.kind==='position'){positions[i]=d.slide||0;if(i===unit)progress()}
 else if(d.kind==='boundary'&&i===unit){if(d.dir===1&&unit<counts.length-1)activate(unit+1,0);else if(d.dir===-1&&unit>0)activate(unit-1,counts[unit-1]-1)}
 else if(d.kind==='jump'&&i===unit){if(d.to==='first')activate(0,0);else if(d.to==='last')activate(counts.length-1,counts[counts.length-1]-1)}
});
select.addEventListener('change',()=>activate(Number(select.value),0));
document.getElementById('masterPrev').addEventListener('click',()=>direction(-1));
document.getElementById('masterNext').addEventListener('click',()=>direction(1));
document.getElementById('masterFull').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener('keydown',e=>{const focus=document.activeElement?.tagName;if(['SELECT','INPUT','TEXTAREA'].includes(focus))return;
 if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){direction(1);e.preventDefault()}
 else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){direction(-1);e.preventDefault()}
 else if(e.key==='Home'){activate(0,0);e.preventDefault()}
 else if(e.key==='End'){activate(counts.length-1,counts[counts.length-1]-1);e.preventDefault()}
 else if(e.key==='f'||e.key==='F'){document.getElementById('masterFull').click();e.preventDefault()}
});
const match=location.hash.match(/^#(\d{1,2})$/), requested=match?Math.max(1,Math.min(TOTAL,Number(match[1]))):1;
frames.forEach((frame,i)=>{frame.srcdoc=decodeBase64(payloads[i])});
if(requested>1){let dest=counts.findIndex((c,i)=>requested<=prefix[i+1]);if(dest>=0)activate(dest,requested-1-prefix[dest]);}
else progress();
})();</script>
</body></html>
